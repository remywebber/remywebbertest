<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Remy Webber — Director of Photography</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFEFB;
    --ink:#151412;
    --muted:#8A8674;
    --line:#E3DECD;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--ink);color:var(--paper);}

  /* Header */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:44px 56px 40px;
    flex-wrap:wrap;
    gap:20px;
  }
  .id-block{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .id-block h1{
    font-size:1.9rem;
    font-weight:700;
    letter-spacing:0.01em;
    text-transform:uppercase;
  }
  .id-block a{display:block;}
  .id-block .role{
    margin-top:4px;
    font-size:0.7rem;
    color:var(--muted);
    letter-spacing:0.06em;
    text-transform:uppercase;
    text-align:center;
  }
  nav{
    display:flex;
    gap:36px;
    padding-top:8px;
  }
  nav a{
    font-size:0.82rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--ink);
    padding-bottom:4px;
    border-bottom:1px solid transparent;
    transition:border-color .15s ease;
  }
  nav a:hover, nav a.active{border-color:var(--ink);}

  @media (orientation: portrait){
    header{
      flex-direction:column;
      align-items:center;
      text-align:center;
    }
    nav{
      justify-content:center;
      width:100%;
      padding-top:4px;
    }
  }

  /* Hero */
  .hero-wrap{
    padding:0 56px;
    max-width:1500px;
    margin:0 auto;
    height:calc(100vh - 160px); /* JS refines this precisely on load/resize */
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .hero-frame{
    aspect-ratio:16/9;
    border-style:solid;
    border-color:#FFFEFB;
    border-width:14px 18px 52px 18px;
    box-sizing:content-box;
    background:
      var(--hero-bg, linear-gradient(120deg, #3b3a35 0%, #6a6558 38%, #b3a487 68%, #ecd9a8 100%));
    position:relative;
    transition:background 0.6s ease;
  }

  /* Work section */
  #work{padding:96px 56px 40px;}
  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:40px;
  }
  .section-head h2{
    font-size:0.82rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .section-head span{font-size:0.78rem;color:var(--muted);}

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px;
  }
  .grid .tile{
    position:relative;
    display:block;
    width:100%;
    aspect-ratio:4/3;
    overflow:hidden;
    background:#222;
    border:none;
    padding:0;
    margin:0;
    font-family:inherit;
    text-align:left;
    cursor:zoom-in;
  }
  .grid .tile .ph{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    transition:transform .5s ease;
  }
  .grid .tile:hover .ph{transform:scale(1.035);}

  .ph1{background:linear-gradient(135deg,#1c1c1a,#4a463d 45%,#8f8168 100%);}
  .ph2{background:linear-gradient(160deg,#0e1418,#233138 50%,#4d6a72 100%);}
  .ph3{background:linear-gradient(140deg,#241512,#6b3b2c 45%,#c98a54 100%);}
  .ph4{background:linear-gradient(150deg,#101012,#39383f 40%,#7d7b86 100%);}
  .ph5{background:linear-gradient(130deg,#181410,#4f4232 45%,#a9915f 100%);}
  .ph6{background:linear-gradient(155deg,#0c1210,#243c34 45%,#5c8a72 100%);}

  /* Contact */
  #contact{
    padding:120px 56px 100px;
    border-top:1px solid var(--line);
    margin-top:60px;
    display:grid;
    grid-template-columns:1.3fr 1fr;
    gap:48px;
    align-items:stretch;
  }
  #contact h2{
    font-size:clamp(1.6rem,2.4vw,2.05rem);
    font-weight:600;
    max-width:20ch;
    letter-spacing:-0.01em;
    line-height:1.35;
  }
  .contact-details{font-size:0.9rem;color:var(--muted);}
  .contact-details .row{
    display:flex;
    justify-content:space-between;
    padding:16px 0;
    border-bottom:1px solid var(--line);
  }
  .contact-details .row span:first-child{color:var(--ink);font-weight:500;}
  .contact-details .row a{border-bottom:1px solid transparent;}
  .contact-details .row a:hover{border-color:var(--ink);}

  footer{
    padding:28px 56px 40px;
    font-size:0.75rem;
    color:var(--muted);
    display:flex;
    justify-content:center;
  }

  /* Lightbox */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(10,9,7,0.94);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:100;
  }
  .lightbox.open{opacity:1;pointer-events:auto;}
  .lightbox-inner{
    max-width:1100px;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .lightbox-frame{
    width:100%;
    aspect-ratio:16/9;
    border-radius:2px;
    opacity:1;
    transition:opacity .16s ease;
  }
  .lightbox-frame.fading{opacity:0;}
  .lightbox-caption{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    color:#F5F2E8;
  }
  .lightbox-caption h3{
    font-size:1.1rem;
    font-weight:600;
    letter-spacing:0.02em;
    text-transform:uppercase;
  }
  .lightbox-caption p{
    font-size:0.82rem;
    color:rgba(245,242,232,0.65);
    margin-top:4px;
  }
  .lightbox-nav{display:flex;gap:14px;align-items:center;}
  .lightbox-nav button{
    background:none;
    border:1px solid rgba(245,242,232,0.35);
    color:#F5F2E8;
    width:36px;height:36px;
    border-radius:50%;
    font-size:1rem;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .lightbox-nav button:hover{border-color:#F5F2E8;background:rgba(245,242,232,0.08);}
  .lightbox-close{
    position:absolute;
    top:32px;right:40px;
    background:none;
    border:none;
    color:#F5F2E8;
    font-size:1.6rem;
    cursor:pointer;
    line-height:1;
  }

  @media(max-width:820px){
    header{padding:28px 24px;}
    .hero-wrap{padding:0 24px;}
    #work{padding:64px 24px 20px;}
    .grid{grid-template-columns:1fr;}
    #contact{grid-template-columns:1fr;padding:80px 24px 60px;gap:32px;align-items:stretch;}
    .lightbox{padding:24px;}
    .lightbox-close{top:16px;right:20px;}
  }
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
</style>
</head>
<body>

<header>
  <div class="id-block">
    <a href="/"><h1>Remy Webber</h1></a>
    <div class="role">Director of Photography</div>
  </div>
  <nav>
    <a href="/work">Work</a>
    <a href="/contact">Contact</a>
  </nav>
</header>

<div class="hero-wrap" id="heroWrap">
  <div class="hero-frame" id="heroFrame"></div>
</div>

<section id="work">
  <div class="section-head">
    <h2>Selected Work</h2>
  </div>
  <div class="grid" id="workGrid">
    <button class="tile" data-index="0"><div class="ph ph1"></div></button>
    <button class="tile" data-index="1"><div class="ph ph2"></div></button>
    <button class="tile" data-index="2"><div class="ph ph3"></div></button>
    <button class="tile" data-index="3"><div class="ph ph4"></div></button>
    <button class="tile" data-index="4"><div class="ph ph5"></div></button>
    <button class="tile" data-index="5"><div class="ph ph6"></div></button>
  </div>
</section>

<section id="contact">
  <h2>Available for narrative, documentary, and commercial work</h2>
  <div class="contact-details">
    <div class="row"><span>Email</span><a href="mailto:info@remywebber.com">info@remywebber.com</a></div>
    <div class="row"><span>Instagram</span><a href="#">@remy_webber</a></div>
    <div class="row"><span>Based in</span><span>Queensland, Australia</span></div>
  </div>
</section>

<footer>
  <span>© 2026 Remy Webber</span>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lbClose" aria-label="Close">&times;</button>
  <div class="lightbox-inner">
    <div class="lightbox-frame ph" id="lbFrame"></div>
    <div class="lightbox-caption">
      <div>
        <h3 id="lbTitle"></h3>
        <p id="lbMeta"></p>
      </div>
      <div class="lightbox-nav">
        <button id="lbPrev" aria-label="Previous project">&larr;</button>
        <button id="lbNext" aria-label="Next project">&rarr;</button>
      </div>
    </div>
  </div>
</div>

<script>
  const projects = [
    { title: "Wolf & Ember", meta: "Dir. Marta Coen — Feature", ph: "ph1" },
    { title: "Low Tide", meta: "Dir. Sam Ashworth — Feature", ph: "ph2" },
    { title: "Harbour Light", meta: "Dir. Priya Nair — Feature", ph: "ph3" },
    { title: "Nightshift", meta: "Dir. Elliot Frame — Series", ph: "ph4" },
    { title: "Salt Circuit", meta: "Dir. Marta Coen — Commercial", ph: "ph5" },
    { title: "The Long Field", meta: "Dir. Devon Ariyo — Feature", ph: "ph6" }
  ];

  /* Hero cycling — advances to the next featured project's frame on every page load */
  const heroFrame = document.getElementById('heroFrame');
  const heroGradients = {
    ph1:"linear-gradient(120deg,#1c1c1a 0%,#4a463d 45%,#8f8168 100%)",
    ph2:"linear-gradient(120deg,#0e1418 0%,#233138 50%,#4d6a72 100%)",
    ph3:"linear-gradient(120deg,#241512 0%,#6b3b2c 45%,#c98a54 100%)",
    ph4:"linear-gradient(120deg,#101012 0%,#39383f 40%,#7d7b86 100%)"
  };
  const heroKeys = ["ph1","ph2","ph3","ph4"];
  let heroIndex = 0;
  try{
    heroIndex = parseInt(localStorage.getItem('heroIndex') || '0', 10);
    if(isNaN(heroIndex)) heroIndex = 0;
    localStorage.setItem('heroIndex', (heroIndex + 1) % heroKeys.length);
  }catch(e){
    heroIndex = Math.floor(Math.random() * heroKeys.length);
  }
  heroFrame.style.setProperty('--hero-bg', heroGradients[heroKeys[heroIndex % heroKeys.length]]);

  /* Fit the hero to exactly fill the space below the header, so Selected Work
     stays off-screen until the user scrolls — regardless of window size. */
  const heroWrap = document.getElementById('heroWrap');
  const headerEl = document.querySelector('header');

  function sizeHero(){
    const headerH = headerEl.offsetHeight;
    const availH = Math.max(window.innerHeight - headerH, 200);
    heroWrap.style.height = availH + 'px';

    const wrapStyles = getComputedStyle(heroWrap);
    const padX = parseFloat(wrapStyles.paddingLeft) + parseFloat(wrapStyles.paddingRight);
    const availW = heroWrap.clientWidth - padX;

    /* Fixed distances from the image content to the window edge — these stay
       constant in px regardless of window size. Bottom is intentionally the
       largest so there's a clear resting margin below the frame. */
    const topBorder = 14;
    const bottomBorder = 52;
    const sideBorderBase = 18;

    let contentW, contentH, sideBorder;

    if(availH > availW * 1.05){
      /* Viewport is more than 5% taller than it is wide: switch to a 9:16
         vertical frame. Side borders stay fixed (never grow) here. */
      sideBorder = sideBorderBase;
      contentW = Math.max(availW - (sideBorder * 2), 60);
      contentH = contentW * (16 / 9);
      const maxContentH = availH - topBorder - bottomBorder;
      if(contentH > maxContentH){
        contentH = Math.max(maxContentH, 60);
        contentW = contentH * (9 / 16);
      }
    } else {
      /* Landscape (or only mildly portrait, under the 5% threshold): fill
         full available height at 16:9, letting the side borders grow to
         soak up any extra width on wide displays. */
      const ratio = 16 / 9;
      contentH = Math.max(availH - topBorder - bottomBorder, 60);
      contentW = contentH * ratio;
      const maxContentW = availW - (sideBorderBase * 2);
      if(contentW > maxContentW){
        contentW = Math.max(maxContentW, 60);
        contentH = contentW / ratio;
        sideBorder = sideBorderBase;
      } else {
        sideBorder = (availW - contentW) / 2;
      }
    }

    heroFrame.style.width = contentW + 'px';
    heroFrame.style.height = contentH + 'px';
    heroFrame.style.borderTopWidth = topBorder + 'px';
    heroFrame.style.borderBottomWidth = bottomBorder + 'px';
    heroFrame.style.borderLeftWidth = sideBorder + 'px';
    heroFrame.style.borderRightWidth = sideBorder + 'px';
  }

  sizeHero();
  window.addEventListener('resize', sizeHero);

  /* Align the contact heading's first and last line exactly with the top
     and bottom of the contact-details block, regardless of copy length. */
  function fitContactHeading(){
    const heading = document.querySelector('#contact h2');
    const details = document.querySelector('.contact-details');
    if(!heading || !details) return;

    const fontSizePx = parseFloat(getComputedStyle(heading).fontSize);
    const baseLineHeight = fontSizePx * 1.35; // matches the CSS's intended ratio, in px

    heading.style.height = 'auto';
    heading.style.lineHeight = baseLineHeight + 'px';

    const naturalH = heading.offsetHeight;
    const lines = Math.max(Math.round(naturalH / baseLineHeight), 1);
    const targetH = details.offsetHeight;

    if(lines > 0 && targetH > 0){
      heading.style.lineHeight = (targetH / lines) + 'px';
      heading.style.height = targetH + 'px';
    }
  }

  fitContactHeading();
  window.addEventListener('resize', fitContactHeading);
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(fitContactHeading);
  }

  /* Lightbox — cycles through all selected work tiles with a brief fade */
  const lightbox = document.getElementById('lightbox');
  const lbFrame = document.getElementById('lbFrame');
  const lbTitle = document.getElementById('lbTitle');
  const lbMeta = document.getElementById('lbMeta');
  let currentIndex = 0;
  let lastFocused = null;

  function renderProject(i){
    currentIndex = (i + projects.length) % projects.length;
    const p = projects[currentIndex];
    lbFrame.className = 'lightbox-frame ph ' + p.ph;
    lbTitle.textContent = p.title;
    lbMeta.textContent = p.meta;
  }

  function showProject(i, animate){
    if(!animate){ renderProject(i); return; }
    lbFrame.classList.add('fading');
    setTimeout(() => {
      renderProject(i);
      lbFrame.classList.remove('fading');
    }, 160);
  }

  function openLightbox(i){
    lastFocused = document.activeElement;
    showProject(i, false);
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('lbClose').focus();
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    if(lastFocused) lastFocused.focus();
  }

  document.querySelectorAll('#workGrid .tile').forEach(tile => {
    tile.addEventListener('click', () => {
      openLightbox(parseInt(tile.dataset.index, 10));
    });
  });

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', () => showProject(currentIndex - 1, true));
  document.getElementById('lbNext').addEventListener('click', () => showProject(currentIndex + 1, true));

  lightbox.addEventListener('click', (e) => {
    if(e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if(!lightbox.classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') showProject(currentIndex - 1, true);
    if(e.key === 'ArrowRight') showProject(currentIndex + 1, true);
  });
</script>

</body>
</html>
