<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Work — Remy Webber</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFEFB;
    --ink:#151412;
    --muted:#8A8674;
    --line:#E3DECD;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--ink);color:var(--paper);}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:44px 56px 40px;
    flex-wrap:wrap;
    gap:20px;
  }
  .id-block{display:flex;flex-direction:column;align-items:center;}
  .id-block h1{font-size:1.9rem;font-weight:700;letter-spacing:0.01em;text-transform:uppercase;}
  .id-block .role{margin-top:4px;font-size:0.7rem;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;text-align:center;}
  nav{display:flex;gap:36px;padding-top:8px;}
  nav a{font-size:0.82rem;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink);padding-bottom:4px;border-bottom:1px solid transparent;transition:border-color .15s ease;}
  nav a:hover, nav a.active{border-color:var(--ink);}

  @media (orientation: portrait){
    header{
      flex-direction:column;
      align-items:center;
      text-align:center;
    }
    nav{
      justify-content:center;
      width:100%;
      padding-top:4px;
    }
  }

  main{padding:20px 56px 100px;}

  .stills{display:flex;flex-direction:column;gap:6px;}
  .still{
    position:relative;
    width:100%;
    aspect-ratio:21/9;
    overflow:hidden;
    border:none;
    padding:0;
    cursor:pointer;
    display:block;
    background:#222;
  }
  .still .ph{width:100%;height:100%;display:block;transition:transform .6s ease;}
  .still:hover .ph{transform:scale(1.02);}
  .still .caption{
    position:absolute;
    left:24px;bottom:20px;
    color:#F5F2E8;
    text-shadow:0 2px 12px rgba(0,0,0,0.5);
  }
  .still .caption .t{font-size:1rem;letter-spacing:0.05em;text-transform:uppercase;}
  .still .caption .m{font-size:0.75rem;color:rgba(245,242,232,0.75);margin-top:4px;}

  .ph1{background:linear-gradient(135deg,#1c1c1a,#4a463d 45%,#8f8168 100%);}
  .ph2{background:linear-gradient(160deg,#0e1418,#233138 50%,#4d6a72 100%);}
  .ph3{background:linear-gradient(140deg,#241512,#6b3b2c 45%,#c98a54 100%);}
  .ph4{background:linear-gradient(150deg,#101012,#39383f 40%,#7d7b86 100%);}
  .ph5{background:linear-gradient(130deg,#181410,#4f4232 45%,#a9915f 100%);}
  .ph6{background:linear-gradient(155deg,#0c1210,#243c34 45%,#5c8a72 100%);}

  footer{padding:28px 56px 40px;font-size:0.75rem;color:var(--muted);display:flex;justify-content:center;}

  /* Carousel */
  .lightbox{
    position:fixed;inset:0;background:rgba(10,9,7,0.94);
    display:flex;align-items:center;justify-content:center;padding:60px;
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:100;
  }
  .lightbox.open{opacity:1;pointer-events:auto;}
  .lightbox-inner{max-width:1200px;width:100%;display:flex;flex-direction:column;gap:18px;}
  .lightbox-frame{width:100%;aspect-ratio:16/9;border-radius:2px;opacity:1;transition:opacity .16s ease;}
  .lightbox-frame.fading{opacity:0;}
  .lightbox-caption{display:flex;justify-content:space-between;align-items:baseline;color:#F5F2E8;}
  .lightbox-caption h3{font-size:1.1rem;font-weight:600;letter-spacing:0.02em;text-transform:uppercase;}
  .lightbox-caption p{font-size:0.82rem;color:rgba(245,242,232,0.65);margin-top:4px;}
  .lightbox-nav{display:flex;gap:14px;align-items:center;}
  .lightbox-nav .counter{font-size:0.75rem;color:rgba(245,242,232,0.6);margin-right:6px;}
  .lightbox-nav button{background:none;border:1px solid rgba(245,242,232,0.35);color:#F5F2E8;width:36px;height:36px;border-radius:50%;font-size:1rem;cursor:pointer;transition:border-color .15s ease, background .15s ease;}
  .lightbox-nav button:hover{border-color:#F5F2E8;background:rgba(245,242,232,0.08);}
  .lightbox-close{position:absolute;top:32px;right:40px;background:none;border:none;color:#F5F2E8;font-size:1.6rem;cursor:pointer;line-height:1;}

  @media(max-width:820px){
    header{padding:28px 24px;}
    main{padding:10px 24px 60px;}
    .still{aspect-ratio:16/9;}
    .lightbox{padding:24px;}
    .lightbox-close{top:16px;right:20px;}
  }
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
</style>
</head>
<body>

<header>
  <div class="id-block">
    <a href="/"><h1>Remy Webber</h1></a>
    <div class="role">Director of Photography</div>
  </div>
  <nav>
    <a href="/work" class="active">Work</a>
    <a href="/contact">Contact</a>
  </nav>
</header>

<main>
  <div class="stills" id="stillsList">
    <button class="still" data-project="0"><div class="ph ph1"></div>
      <div class="caption"><div class="t">Wolf &amp; Ember</div><div class="m">Dir. Marta Coen — Feature</div></div>
    </button>
    <button class="still" data-project="1"><div class="ph ph2"></div>
      <div class="caption"><div class="t">Low Tide</div><div class="m">Dir. Sam Ashworth — Feature</div></div>
    </button>
    <button class="still" data-project="2"><div class="ph ph3"></div>
      <div class="caption"><div class="t">Harbour Light</div><div class="m">Dir. Priya Nair — Feature</div></div>
    </button>
    <button class="still" data-project="3"><div class="ph ph4"></div>
      <div class="caption"><div class="t">Nightshift</div><div class="m">Dir. Elliot Frame — Series</div></div>
    </button>
    <button class="still" data-project="4"><div class="ph ph5"></div>
      <div class="caption"><div class="t">Salt Circuit</div><div class="m">Dir. Marta Coen — Commercial</div></div>
    </button>
    <button class="still" data-project="5"><div class="ph ph6"></div>
      <div class="caption"><div class="t">The Long Field</div><div class="m">Dir. Devon Ariyo — Feature</div></div>
    </button>
  </div>
</main>

<footer><span>© 2026 Remy Webber</span></footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lbClose" aria-label="Close">&times;</button>
  <div class="lightbox-inner">
    <div class="lightbox-frame ph" id="lbFrame"></div>
    <div class="lightbox-caption">
      <div>
        <h3 id="lbTitle"></h3>
        <p id="lbMeta"></p>
      </div>
      <div class="lightbox-nav">
        <span class="counter" id="lbCounter"></span>
        <button id="lbPrev" aria-label="Previous still">&larr;</button>
        <button id="lbNext" aria-label="Next still">&rarr;</button>
      </div>
    </div>
  </div>
</div>

<script>
  /* Each project has its own set of stills (a few frames from that shoot) */
  const projects = [
    { title:"Wolf & Ember", meta:"Dir. Marta Coen — Feature",
      stills:[{ph:"ph1",filter:"none"},{ph:"ph1",filter:"hue-rotate(20deg) brightness(1.08)"},{ph:"ph1",filter:"hue-rotate(-15deg) brightness(0.92)"},{ph:"ph1",filter:"hue-rotate(35deg) brightness(1.02)"}] },
    { title:"Low Tide", meta:"Dir. Sam Ashworth — Feature",
      stills:[{ph:"ph2",filter:"none"},{ph:"ph2",filter:"hue-rotate(18deg) brightness(1.05)"},{ph:"ph2",filter:"hue-rotate(-20deg) brightness(0.95)"}] },
    { title:"Harbour Light", meta:"Dir. Priya Nair — Feature",
      stills:[{ph:"ph3",filter:"none"},{ph:"ph3",filter:"hue-rotate(14deg) brightness(1.06)"},{ph:"ph3",filter:"hue-rotate(-18deg) brightness(0.9)"},{ph:"ph3",filter:"hue-rotate(28deg) brightness(1.0)"}] },
    { title:"Nightshift", meta:"Dir. Elliot Frame — Series",
      stills:[{ph:"ph4",filter:"none"},{ph:"ph4",filter:"hue-rotate(22deg) brightness(1.04)"},{ph:"ph4",filter:"hue-rotate(-24deg) brightness(0.93)"}] },
    { title:"Salt Circuit", meta:"Dir. Marta Coen — Commercial",
      stills:[{ph:"ph5",filter:"none"},{ph:"ph5",filter:"hue-rotate(16deg) brightness(1.07)"},{ph:"ph5",filter:"hue-rotate(-20deg) brightness(0.92)"}] },
    { title:"The Long Field", meta:"Dir. Devon Ariyo — Feature",
      stills:[{ph:"ph6",filter:"none"},{ph:"ph6",filter:"hue-rotate(12deg) brightness(1.05)"},{ph:"ph6",filter:"hue-rotate(-16deg) brightness(0.94)"},{ph:"ph6",filter:"hue-rotate(26deg) brightness(1.0)"}] }
  ];

  const lightbox = document.getElementById('lightbox');
  const lbFrame = document.getElementById('lbFrame');
  const lbTitle = document.getElementById('lbTitle');
  const lbMeta = document.getElementById('lbMeta');
  const lbCounter = document.getElementById('lbCounter');
  let projIndex = 0;
  let stillIndex = 0;
  let lastFocused = null;

  function renderStill(){
    const p = projects[projIndex];
    const s = p.stills[stillIndex];
    lbFrame.className = 'lightbox-frame ph ' + s.ph;
    lbFrame.style.filter = s.filter;
    lbTitle.textContent = p.title;
    lbMeta.textContent = p.meta;
    lbCounter.textContent = (stillIndex + 1) + ' / ' + p.stills.length;
  }

  function showStill(i, animate){
    const p = projects[projIndex];
    stillIndex = (i + p.stills.length) % p.stills.length;
    if(!animate){ renderStill(); return; }
    lbFrame.classList.add('fading');
    setTimeout(() => {
      renderStill();
      lbFrame.classList.remove('fading');
    }, 160);
  }

  function openLightbox(pIndex){
    lastFocused = document.activeElement;
    projIndex = pIndex;
    stillIndex = 0;
    renderStill();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('lbClose').focus();
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    if(lastFocused) lastFocused.focus();
  }

  document.querySelectorAll('#stillsList .still').forEach(el => {
    el.addEventListener('click', () => openLightbox(parseInt(el.dataset.project, 10)));
  });

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', () => showStill(stillIndex - 1, true));
  document.getElementById('lbNext').addEventListener('click', () => showStill(stillIndex + 1, true));

  lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });

  document.addEventListener('keydown', (e) => {
    if(!lightbox.classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') showStill(stillIndex - 1, true);
    if(e.key === 'ArrowRight') showStill(stillIndex + 1, true);
  });
</script>

</body>
</html>
