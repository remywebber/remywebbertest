<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{ --paper:#FFFEFB; --ink:#151412; --muted:#8A8674; --line:#E3DECD; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{ background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; line-height:1.5; min-height:100vh; display:flex; flex-direction:column; }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--ink);color:var(--paper);} 

  header{ display:flex; justify-content:space-between; align-items:flex-start; padding:44px 56px 40px; flex-wrap:wrap; gap:20px; }
  .id-block{display:flex;flex-direction:column;align-items:center;}
  .id-block h1{font-size:1.9rem;font-weight:700;letter-spacing:0.01em;text-transform:uppercase;}
  .id-block .role{margin-top:4px;font-size:0.7rem;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;text-align:center;}
  nav{display:flex;gap:36px;padding-top:8px;}
  nav a{font-size:0.82rem;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink);padding-bottom:4px;border-bottom:1px solid transparent;transition:border-color .15s ease;}
  nav a:hover, nav a.active{border-color:var(--ink);}

  @media (orientation: portrait){
    header{ flex-direction:column; align-items:center; text-align:center; }
    nav{ justify-content:center; width:100%; padding-top:4px; }
  }

  main{ flex:1; display:flex; align-items:flex-start; }
  #contact{ padding:120px 56px 100px; display:grid; grid-template-columns:1.3fr 1fr; gap:48px; width:100%; align-items:stretch; }
  #contact h2{ font-size:clamp(1.4rem,2.1vw,1.85rem); font-weight:600; max-width:20ch; letter-spacing:-0.01em; line-height:1.35; }
  #contact h2 .lead{display:block;margin-bottom:0;font-size:0.98em;line-height:1;color:#9D7D5C;}
  #contact h2 .sub{display:block;font-size:0.82em;margin-top:0;line-height:1;}
  .contact-details{font-size:0.9rem;color:var(--muted);} 
  .contact-details .row{ display:flex; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--line); }
  .contact-details .row > :first-child{color:var(--ink);font-weight:500;}
  .contact-details .row > :last-child{color:#9D7D5C;}
  .contact-details .row .ig-label{display:inline-flex;align-items:center;gap:8px;}
  .contact-details .row .ig-label img{width:1em;height:1em;display:block;} 
  .contact-details .row a{border-bottom:1px solid transparent;} 
  .contact-details .row a:hover{border-color:var(--ink);} 
  footer{padding:28px 56px 40px;font-size:0.75rem;color:var(--muted);display:flex;justify-content:center;}

  .bts-photo{padding:8px 56px 72px;display:flex;justify-content:center;}
  .bts-photo .frame{
    /* Never taller than ~62vh and never wider than 1200px / 72vw, so the
       whole photo always stays within view regardless of viewport shape. */
    width:min(1200px, 72vw, 110.9vh);
    aspect-ratio:16/9;
    margin:0 auto;
    padding:20px;
    border:1px solid var(--line);
    background:var(--paper);
  }
  .bts-photo .frame-inner{
    width:100%;
    height:100%;
    overflow:hidden;
    border-radius:2px;
  }
  .bts-photo img{width:100%;height:100%;display:block;object-fit:cover;}

  @media(max-width:820px){
    header{padding:28px 24px;}
    #contact{grid-template-columns:1fr;padding:80px 24px 60px;gap:32px;align-items:stretch;}
    .bts-photo{padding:8px 24px 56px;}
    .bts-photo .frame{padding:12px;}
  }
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
</style>
</head>
<body>

<header>
  <div class="id-block">
    <a href="../"><h1>Remy Webber</h1></a>
    <div class="role">Cinematographer</div>
  </div>
  <nav aria-label="Main Navigation">
    <a href="../work/">Work</a>
    <a href="./" class="active">Contact</a>
  </nav>
</header>

<main>
  <section id="contact">
    <h2><span class="lead">Let's Work Together!</span><br><span class="sub">Available for all narrative, documentary, music video,<br>and commercial work</span></h2>
    <div class="contact-details">
      <div class="row"><span>Email</span><a href="mailto:info@remywebber.com">info@remywebber.com</a></div>
      <div class="row"><a class="ig-label" href="https://www.instagram.com/remy_webber/" target="_blank" rel="noopener noreferrer">Instagram<img src="../images/icons/instagram.png" alt="Remy Webber Instagram"></a><a href="https://www.instagram.com/remy_webber/" target="_blank" rel="noopener noreferrer">@remy_webber</a></div>
      <div class="row"><span>Based in</span><span>Queensland, Australia</span></div>
    </div>
  </section>
</main>

<div class="bts-photo">
  <div class="frame">
    <div class="frame-inner">
      <img src="../images/cinematography-alexa-mini-LF-shortfilm-operating.jpg" alt="Remy Webber operating an ARRI Alexa Mini LF on a short film set" loading="lazy">
    </div>
  </div>
</div>

<footer><span>© 2026 Remy Webber</span></footer>

<script>
  function fitContactHeading(){
    const heading = document.querySelector('#contact h2');
    const details = document.querySelector('.contact-details');
    if(!heading || !details) return;
    const fontSizePx = parseFloat(getComputedStyle(heading).fontSize);
    const baseLineHeight = fontSizePx * 1.35; 
    heading.style.height = 'auto';
    heading.style.lineHeight = baseLineHeight + 'px';
    const naturalH = heading.offsetHeight;
    const lines = Math.max(Math.round(naturalH / baseLineHeight), 1);
    const targetH = details.offsetHeight;

    if(lines > 0 && targetH > 0){
      let desiredLineHeight = (targetH / lines);
      const maxLineHeight = baseLineHeight * 1.02; 
      if(desiredLineHeight > maxLineHeight) desiredLineHeight = maxLineHeight;
      heading.style.lineHeight = desiredLineHeight + 'px';
      heading.style.height = (desiredLineHeight * lines) + 'px';
    }
  }

  fitContactHeading();
  window.addEventListener('resize', fitContactHeading);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fitContactHeading); }
</script>

</body>
</html>
