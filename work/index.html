<style>
  :root{
    --paper:#FFFEFB;
    --ink:#151412;
    --muted:#8A8674;
    --line:#E3DECD;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--ink);color:var(--paper);}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:44px 56px 40px;
    flex-wrap:wrap;
    gap:20px;
  }
  .id-block{display:flex;flex-direction:column;align-items:center;}
  .id-block h1{font-size:1.9rem;font-weight:700;letter-spacing:0.01em;text-transform:uppercase;}
  .id-block .role{margin-top:4px;font-size:0.7rem;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;text-align:center;}
  nav{display:flex;gap:36px;padding-top:8px;}
  nav a{font-size:0.82rem;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink);padding-bottom:4px;border-bottom:1px solid transparent;transition:border-color .15s ease;}
  nav a:hover, nav a.active{border-color:var(--ink);}

  @media (orientation: portrait){
    header{
      flex-direction:column;
      align-items:center;
      text-align:center;
    }
    nav{
      justify-content:center;
      width:100%;
      padding-top:4px;
    }
  }

  main{padding:20px 56px 100px;}

  footer{
    padding:28px 56px 40px;
    font-size:0.75rem;
    color:#8D7153;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-align:center;
  }
  footer nav{padding-top:0;gap:24px;}
  footer nav a{font-size:0.72rem;display:inline-flex;align-items:center;}
  footer nav a img{width:1em;height:1em;display:block;}
  footer .service-area{max-width:760px;}

  .stills{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .still{
    position:relative;
    width:100%;
    max-width:var(--still-max-width, calc((100vh - 170px) * 2));
    aspect-ratio:2/1;
    overflow:hidden;
    border:none;
    padding:0;
    cursor:pointer;
    display:block;
    background:#222;
    text-align:left;
  }
  /* The grid thumbnail is always the project's 1st image, cropped to fill
     the 2:1 box (object-fit:cover), regardless of its native ratio. */
  .still .ph{width:100%;height:100%;display:block;object-fit:cover;transition:transform .6s ease;}
  .still:hover .ph{transform:scale(1.02);}
  .still .caption{
    position:absolute;
    left:24px;bottom:20px;
    color:#F5F2E8;
    text-shadow:0 2px 12px rgba(0,0,0,0.5);
  }
  .still .caption .t{font-size:1rem;letter-spacing:0.05em;text-transform:uppercase;}
  .still .caption .m{font-size:0.75rem;color:rgba(245,242,232,0.75);margin-top:4px;}

  /* Reel tile — same 2:1 box as a still, plus a centered play button */
  .reel-play{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:64px;height:64px;
    border-radius:50%;
    background:rgba(21,20,18,0.55);
    border:1px solid rgba(245,242,232,0.7);
    transition:background .15s ease, border-color .15s ease;
    pointer-events:none;
  }
  .reel-play::after{
    content:'';
    position:absolute;
    top:50%;left:56%;
    transform:translate(-50%,-50%);
    border-style:solid;
    border-width:11px 0 11px 18px;
    border-color:transparent transparent transparent #F5F2E8;
  }
  .still.reel-still:hover .reel-play{background:rgba(21,20,18,0.75);border-color:#F5F2E8;}

  /* Carousel */
  .lightbox{
    position:fixed;inset:0;background:rgba(10,9,7,0.94);
    display:flex;align-items:center;justify-content:center;padding:60px;
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:100;
  }
  .lightbox.open{opacity:1;pointer-events:auto;}
  .lightbox-inner{max-width:1600px;width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;}
  .lightbox-frame{
    /* A real <img>, so the browser scales it to its own native ratio —
       square, 4:3, 16:9, or ultra-wide 2.39:1 / 2.55:1 cinema stills all
       just fit within these two caps without distortion. */
    display:block;
    max-width:100%;
    max-height:min(70vh, 720px);
    width:auto;
    height:auto;
    border-radius:2px;
    opacity:1;
    transition:opacity .16s ease;
  }
  .lightbox-frame.fading{opacity:0;}
  .lightbox-caption{width:100%;display:flex;justify-content:space-between;align-items:baseline;color:#F5F2E8;text-align:left;}
  .lightbox-caption h3{font-size:1.1rem;font-weight:600;letter-spacing:0.02em;text-transform:uppercase;}
  .lightbox-caption p{font-size:0.82rem;color:#8D7153;margin-top:4px;}
  .lightbox-nav{display:flex;gap:14px;align-items:center;}
  .lightbox-nav .counter{font-size:0.75rem;color:rgba(245,242,232,0.6);margin-right:6px;}
  .lightbox-nav button{background:none;border:1px solid rgba(245,242,232,0.35);color:#F5F2E8;width:36px;height:36px;border-radius:50%;font-size:1rem;cursor:pointer;transition:border-color .15s ease, background .15s ease;}
  .lightbox-nav button:hover{border-color:#F5F2E8;background:rgba(245,242,232,0.08);}
  .lightbox-close{position:absolute;top:32px;right:40px;background:none;border:none;color:#F5F2E8;font-size:1.6rem;cursor:pointer;line-height:1;}

  /* Reel lightbox — same overlay, but a fixed 16:9 video frame instead
     of a variable-ratio still image, and no prev/next/counter since
     there's only one video. */
  .reel-inner{max-width:1200px;}
  .reel-frame{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:2px;
    overflow:hidden;
  }
  .reel-frame video, .reel-frame iframe{width:100%;height:100%;display:block;border:0;}
  .reel-title{width:100%;text-align:left;color:#F5F2E8;font-size:1.1rem;font-weight:600;letter-spacing:0.02em;text-transform:uppercase;}

  @media(max-width:820px){
    header{padding:28px 24px;}
    main{padding:10px 24px 60px;}
    .lightbox{padding:24px;}
    .lightbox-close{top:16px;right:20px;}
  }
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
</style>
</head>
<body>

<header>
  <div class="id-block">
    <a href="../"><h1>Remy Webber</h1></a>
    <div class="role">Director of Photography</div>
  </div>
  <nav aria-label="Main Navigation">
    <a href="./" class="active">Work</a>
    <a href="../contact/">Contact</a>
  </nav>
</header>

<main>
  <div class="stills" id="stillsList"></div>
</main>

<footer>
  <nav aria-label="Footer">
    <a href="../">Home</a>
    <a href="../contact/">Contact</a>
    <a href="https://www.instagram.com/remy_webber/" rel="me noopener noreferrer" target="_blank" aria-label="Instagram"><img src="../images/icons/instagram.png" alt=""></a>
  </nav>
  <span class="service-area">Available for narrative, documentary, music video and commercial work across Queensland and Australia.</span>
  <span>© 2026 Remy Webber</span>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lbClose" aria-label="Close">&times;</button>
  <div class="lightbox-inner">
    <img class="lightbox-frame" id="lbFrame" alt="">
    <div class="lightbox-caption">
      <div>
        <h3 id="lbTitle"></h3>
        <p id="lbMeta"></p>
        <p id="lbCamera"></p>
      </div>
      <div class="lightbox-nav">
        <span class="counter" id="lbCounter"></span>
        <button id="lbPrev" aria-label="Previous still">&larr;</button>
        <button id="lbNext" aria-label="Next still">&rarr;</button>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="reelLightbox">
  <button class="lightbox-close" id="reelClose" aria-label="Close">&times;</button>
  <div class="lightbox-inner reel-inner">
    <div class="reel-frame" id="reelFrame"></div>
    <h3 class="reel-title">Remy Webber Cinematography Reel</h3>
  </div>
</div>

<script>
  /* Single source of truth for every project. "slug" is both the folder
     name and the filename prefix under images/work/ (lowercase, no
     spaces, matching how folders are named on GitHub), e.g. BROOD's
     stills 2+ live at images/work/brood/brood-2.png ... brood-11.png.
     "firstStill" overrides the filename of still #1 only (ACS awards
     cinematography naming) — stills 2+ keep the slug-N.png pattern.
     "camera" is the camera/lens line shown under the director text in
     the expanded lightbox view.
     "count" is how many numbered stills that project has. */
  const projects = [
    { title:"Little Pumpkin",       slug:"littlepumpkin",      anchor:"little-pumpkin",             meta:"Dir. Jessica Fisher — Short Film",       count:8,  firstStill:"shortfilm-alexa-mini-lf-tokinavista-ACS-awards-cinematography", camera:'ARRI Alexa Mini LF — Tokina Vista Primes' },
    { title:"BROOD",                 slug:"brood",               anchor:"brood",                       meta:"Dir. Sasha Aubort — Fashion Film",       count:11, firstStill:"fashionfilm-alexa-mini-lf-canonv35-ACS-awards-cinematography", camera:'ARRI Alexa Mini LF — Canon V35, Mamiya 645, Angenieux Optimo 24-290mm' },
    { title:"No Devil Lived On",    slug:"nodevillivedon",     anchor:"no-devil-lived-on",           meta:"Dir. Shuban Krishnar — Short Film",      count:8,  firstStill:"shortfilm-alexa-mini-lf-panavisionprimo-ACS-awards-cinematography", camera:'ARRI Alexa Mini — Panavision Primo Noir' },
    { title:"Chasing Harvey",       slug:"chasingharvey",      anchor:"chasing-harvey",              meta:"Dir. Jessica Fisher — Short Film",       count:8,  firstStill:"shortfilm-alexa-mini-lf-dzoanamorphic-ACS-awards-cinematography", camera:'ARRI Alexa Mini LF — DZO Pavo 2x Anamorphic' },
    { title:"Housemate from Hell",  slug:"housematefromhell",  anchor:"housemate-from-hell",         meta:"Dir. Jessica Fisher — Short Film",       count:10, firstStill:"shortfilm-alexa-mini-lf-dzoarles-ACS-awards-cinematography", camera:'ARRI Alexa Mini LF — DZO Arles Primes' },
    { title:"Travel Money Oz — “Feverdream”", slug:"travelmoneyoz", anchor:"travel-money-oz-feverdream", meta:"Dir. Reilly Vanniekerk — Commercial", count:6, firstStill:"commercial-alexa-mini-lf-tokinavista-ACS-awards-cinematography", camera:'ARRI Alexa Mini LF — Tokina Vista Primes' },
    { title:"Solitude",             slug:"solitude",            anchor:"solitude",                    meta:"Dir. Maia Jorgensen — Short Film",       count:9,  firstStill:"shortfilm-alexa-mini-lf-mamiya-ACS-awards-cinematography", camera:'ARRI Alexa Mini LF — Mamiya 645, Zeiss CP2 Primes' },
    { title:"Mud Man",              slug:"mudman",              anchor:"mud-man",                     meta:"Dir. Madi Lee-Hislop — Dance Film",      count:7,  firstStill:"dancefilm-alexa-mini-lf-sigma-ACS-awards-cinematography", camera:'ARRI Alexa Mini LF — Canon Sumire Primes' },
    { title:"Dont Bite",            slug:"dontbite",            anchor:"dont-bite",                   meta:"Dir. Seth Griffiths-Kemp — Visualiser",  count:6,  firstStill:"visualiser-alexa-mini-lf-zeiss-ACS-awards-cinematography", camera:'Sony FX6 — Tokina Vista Primes' }
  ];

  function stillUrl(project, n){
    if(n === 1 && project.firstStill){
      return '/images/work/' + project.slug + '/' + project.firstStill + '.png';
    }
    return '/images/work/' + project.slug + '/' + project.slug + '-' + n + '.png';
  }

  /* Cap the grid stills' width so that, at a 2:1 ratio, the resulting
     height always leaves the first still fully visible beneath the
     header — no matter how wide (or short) the viewport is. */
  function setStillCap(){
    const header = document.querySelector('header');
    const main = document.querySelector('main');
    const headerHeight = header.getBoundingClientRect().height;
    const mainPaddingTop = parseFloat(getComputedStyle(main).paddingTop) || 0;
    const available = window.innerHeight - headerHeight - mainPaddingTop;
    const cappedWidth = Math.max(available, 0) * 2; // 2:1 aspect ratio
    document.documentElement.style.setProperty('--still-max-width', cappedWidth + 'px');
  }

  /* Your showreel. This is the one thing to point at wherever the video
     actually ends up living:
       - Self-hosted on GitHub (type:"video"): add a /videos folder at
         the repo root, upload the file there, and set videoSrc to its
         path, e.g. "videos/reel.mp4".
       - YouTube (type:"youtube", recommended — see chat for why): set
         youtubeId to the id from the video's URL — the part after
         "v=", e.g. youtube.com/watch?v=XXXXXXXXXXX → "XXXXXXXXXXX".
         Uploading as "Unlisted" keeps it out of YouTube's own search
         and your channel page while still working perfectly embedded
         here.
     "poster" is the thumbnail shown on the tile before it's clicked. */
  const REEL = {
    title: "Remy Webber Cinematography Reel",
    poster: "../images/reel-poster.jpg",
    type: "youtube",
    videoSrc: "../videos/reel.mp4",
    youtubeId: "2qPa_q6u3os"
  };

  function buildGrid(){
    const container = document.getElementById('stillsList');
    const reelHtml = `
      <button class="still reel-still" id="reel-cta" type="button">
        <img class="ph" src="${REEL.poster}" alt="${REEL.title} — watch the showreel" loading="eager">
        <span class="reel-play" aria-hidden="true"></span>
        <div class="caption"><div class="t">${REEL.title}</div></div>
      </button>`;
    const stillsHtml = projects.map((p, i) => `
      <button class="still" id="${p.anchor}" data-project="${i}">
        <img class="ph" src="${stillUrl(p, 1)}" alt="${p.title} — ${p.meta}, cinematography by Remy Webber" loading="${i === 0 ? 'eager' : 'lazy'}">
        <div class="caption"><div class="t">${p.title}</div><div class="m">${p.meta}</div></div>
      </button>
    `).join('');
    container.innerHTML = reelHtml + stillsHtml;
    container.querySelectorAll('.still[data-project]').forEach(el => {
      el.addEventListener('click', () => openLightbox(parseInt(el.dataset.project, 10)));
    });
    document.getElementById('reel-cta').addEventListener('click', openReel);
  }

  const lightbox = document.getElementById('lightbox');
  const lbFrame = document.getElementById('lbFrame');
  const lbTitle = document.getElementById('lbTitle');
  const lbMeta = document.getElementById('lbMeta');
  const lbCamera = document.getElementById('lbCamera');
  const lbCounter = document.getElementById('lbCounter');
  let projIndex = 0;
  let stillIndex = 0;
  let lastFocused = null;

  function renderStill(){
    const p = projects[projIndex];
    lbFrame.src = stillUrl(p, stillIndex + 1);
    lbFrame.alt = p.title + ' — ' + p.meta + ', still ' + (stillIndex + 1) + ', cinematography by Remy Webber';
    lbTitle.textContent = p.title;
    lbMeta.textContent = p.meta;
    lbCamera.textContent = p.camera;
    lbCounter.textContent = (stillIndex + 1) + ' / ' + p.count;
  }

  function showStill(i, animate){
    const p = projects[projIndex];
    stillIndex = (i + p.count) % p.count;
    if(!animate){ renderStill(); return; }
    lbFrame.classList.add('fading');
    setTimeout(() => {
      renderStill();
      lbFrame.classList.remove('fading');
    }, 160);
  }

  function openLightbox(pIndex){
    lastFocused = document.activeElement;
    projIndex = pIndex;
    stillIndex = 0; // the project's 1st image opens by default
    renderStill();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('lbClose').focus();
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    if(lastFocused) lastFocused.focus();
  }

  const reelLightbox = document.getElementById('reelLightbox');
  const reelFrame = document.getElementById('reelFrame');
  let reelLastFocused = null;

  function openReel(){
    reelLastFocused = document.activeElement;
    if(REEL.type === 'youtube' && REEL.youtubeId){
      reelFrame.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + REEL.youtubeId + '?rel=0" title="' + REEL.title + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
    } else {
      reelFrame.innerHTML = '<video src="' + REEL.videoSrc + '" controls playsinline preload="metadata"></video>';
    }
    reelLightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('reelClose').focus();
  }

  function closeReel(){
    reelLightbox.classList.remove('open');
    reelFrame.innerHTML = ''; // stop playback once closed
    document.body.style.overflow = '';
    if(reelLastFocused) reelLastFocused.focus();
  }

  document.getElementById('reelClose').addEventListener('click', closeReel);

  reelLightbox.addEventListener('click', (e) => {
    if(e.target.closest('.reel-frame')) return;
    if(e.target.closest('button, a')) return;
    closeReel();
  });

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', () => showStill(stillIndex - 1, true));
  document.getElementById('lbNext').addEventListener('click', () => showStill(stillIndex + 1, true));

  // Close on any click outside the still image itself — the caption,
  // the surrounding padding, and the gaps around the nav buttons are
  // all "outside", but a click on an actual control (close/prev/next)
  // still just performs that control's own action.
  lightbox.addEventListener('click', (e) => {
    if(e.target === lbFrame) return;
    if(e.target.closest('button, a')) return;
    closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if(lightbox.classList.contains('open')){
      if(e.key === 'Escape') closeLightbox();
      if(e.key === 'ArrowLeft') showStill(stillIndex - 1, true);
      if(e.key === 'ArrowRight') showStill(stillIndex + 1, true);
    } else if(reelLightbox.classList.contains('open')){
      if(e.key === 'Escape') closeReel();
    }
  });

  setStillCap();
  buildGrid();
  window.addEventListener('resize', setStillCap);
  window.addEventListener('load', setStillCap);

  // Deep-linking: /work/#brood (etc.) opens that project's lightbox on load.
  function openFromHash(){
    const anchor = location.hash.replace('#', '');
    if(!anchor) return;
    const idx = projects.findIndex(p => p.anchor === anchor);
    if(idx !== -1) openLightbox(idx);
  }
  openFromHash();
  window.addEventListener('hashchange', openFromHash);
</script>
