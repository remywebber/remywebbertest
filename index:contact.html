<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact — Remy Webber</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFEFB;
    --ink:#151412;
    --muted:#8A8674;
    --line:#E3DECD;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--ink);color:var(--paper);}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:44px 56px 40px;
    flex-wrap:wrap;
    gap:20px;
  }
  .id-block{display:flex;flex-direction:column;align-items:center;}
  .id-block h1{font-size:1.9rem;font-weight:700;letter-spacing:0.01em;text-transform:uppercase;}
  .id-block .role{margin-top:4px;font-size:0.7rem;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;text-align:center;}
  nav{display:flex;gap:36px;padding-top:8px;}
  nav a{font-size:0.82rem;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink);padding-bottom:4px;border-bottom:1px solid transparent;transition:border-color .15s ease;}
  nav a:hover, nav a.active{border-color:var(--ink);}

  @media (orientation: portrait){
    header{
      flex-direction:column;
      align-items:center;
      text-align:center;
    }
    nav{
      justify-content:center;
      width:100%;
      padding-top:4px;
    }
  }

  main{
    flex:1;
    display:flex;
    align-items:flex-start;
  }
  #contact{
    padding:14px 56px 100px;
    display:grid;
    grid-template-columns:1.3fr 1fr;
    gap:48px;
    width:100%;
    align-items:stretch;
  }
  #contact h2{
    font-size:clamp(1.6rem,2.4vw,2.05rem);
    font-weight:600;
    max-width:20ch;
    letter-spacing:-0.01em;
    line-height:1.35;
  }
  .contact-details{font-size:0.9rem;color:var(--muted);}
  .contact-details .row{
    display:flex;
    justify-content:space-between;
    padding:16px 0;
    border-bottom:1px solid var(--line);
  }
  .contact-details .row span:first-child{color:var(--ink);font-weight:500;}
  .contact-details .row a{border-bottom:1px solid transparent;}
  .contact-details .row a:hover{border-color:var(--ink);}

  footer{padding:28px 56px 40px;font-size:0.75rem;color:var(--muted);display:flex;justify-content:center;}

  @media(max-width:820px){
    header{padding:28px 24px;}
    #contact{grid-template-columns:1fr;padding:40px 24px 60px;gap:32px;align-items:stretch;}
  }
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
</style>
</head>
<body>

<header>
  <div class="id-block">
    <a href="../"><h1>Remy Webber</h1></a>
    <div class="role">Director of Photography</div>
  </div>
  <nav>
    <a href="../work/">Work</a>
    <a href="./" class="active">Contact</a>
  </nav>
</header>

<main>
  <section id="contact">
    <h2>Available for narrative, documentary, and commercial work</h2>
    <div class="contact-details">
      <div class="row"><span>Email</span><a href="mailto:info@remywebber.com">info@remywebber.com</a></div>
      <div class="row"><span>Instagram</span><a href="#">@remy_webber</a></div>
      <div class="row"><span>Based in</span><span>Queensland, Australia</span></div>
    </div>
  </section>
</main>

<footer><span>© 2026 Remy Webber</span></footer>

<script>
  /* Align the contact heading's first and last line exactly with the top
     and bottom of the contact-details block, regardless of copy length. */
  function fitContactHeading(){
    const heading = document.querySelector('#contact h2');
    const details = document.querySelector('.contact-details');
    if(!heading || !details) return;

    const fontSizePx = parseFloat(getComputedStyle(heading).fontSize);
    const baseLineHeight = fontSizePx * 1.35; // matches the CSS's intended ratio, in px

    heading.style.height = 'auto';
    heading.style.lineHeight = baseLineHeight + 'px';

    const naturalH = heading.offsetHeight;
    const lines = Math.max(Math.round(naturalH / baseLineHeight), 1);
    const targetH = details.offsetHeight;

    if(lines > 0 && targetH > 0){
      heading.style.lineHeight = (targetH / lines) + 'px';
      heading.style.height = targetH + 'px';
    }
  }

  fitContactHeading();
  window.addEventListener('resize', fitContactHeading);
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(fitContactHeading);
  }
</script>

</body>
</html>
